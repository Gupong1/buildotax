name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.6'  # Menggunakan versi yang lebih stabil
          channel: 'stable'

      # --- PATCH pubspec.yaml ---
      - name: Fix pubspec.yaml for compatibility
        run: |
          # Fix SDK constraint
          sed -i 's/sdk: ">=3.8.1 <4.0.0"/sdk: ">=3.0.0 <4.0.0"/' pubspec.yaml
          
          # Turunkan versi package yang bermasalah
          sed -i 's/dynamic_color: ^1.7.0/dynamic_color: ^1.6.9/' pubspec.yaml
          sed -i 's/awesome_notifications: ^0.10.1/awesome_notifications: ^0.8.3/' pubspec.yaml
          sed -i 's/audioplayers: ^6.5.1/audioplayers: ^6.0.0/' pubspec.yaml
          sed -i 's/dio: ^5.7.0/dio: ^5.4.0/' pubspec.yaml
          sed -i 's/file_picker: ^10.2.0/file_picker: ^8.0.0/' pubspec.yaml
          sed -i 's/system_alert_window: ^2.0.0/system_alert_window: ^3.0.0/' pubspec.yaml
          sed -i 's/flutter_foreground_task: ^9.2.0/flutter_foreground_task: ^8.0.0/' pubspec.yaml
          sed -i 's/flutter_overlay_window: ^0.4.3/flutter_overlay_window: ^0.5.0/' pubspec.yaml

      # --- PATCH build.gradle.kts ---
      - name: Fix Gradle configuration
        run: |
          # Tambahkan buildscript ke android/build.gradle.kts
          if ! grep -q "buildscript" android/build.gradle.kts; then
            cat << 'EOF' > android/build.gradle.kts.new
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath("com.android.tools.build:gradle:8.1.0")
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0")
                  classpath("com.google.gms:google-services:4.3.15")
              }
          }
          EOF
            cat android/build.gradle.kts >> android/build.gradle.kts.new
            mv android/build.gradle.kts.new android/build.gradle.kts
          fi

          # Tambahkan kotlin.version ke gradle.properties
          if ! grep -q "kotlin.version" android/gradle.properties; then
            echo "kotlin.version=1.9.0" >> android/gradle.properties
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
