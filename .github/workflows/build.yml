name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: Fix all build issues
        run: |
          # Fix pubspec.yaml
          sed -i 's/sdk: ">=3.8.1 <4.0.0"/sdk: ">=3.0.0 <4.0.0"/' pubspec.yaml
          
          # Fix gradle-wrapper.properties (cek lokasi yang benar)
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/gradle-8.12-all.zip/gradle-8.3-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          elif [ -f "android/gradle-wrapper.properties" ]; then
            sed -i 's/gradle-8.12-all.zip/gradle-8.3-all.zip/' android/gradle-wrapper.properties
          fi
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
