name: Flutter UI Review

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Generate web build
      run: flutter build web --release --base-href="/${GITHUB_REPOSITORY#*/}/"
      continue-on-error: true  # Tetap lanjut meskipun ada error
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/web
        destination_dir: ./pr-preview/${{ github.event.number || 'main' }}
        keep_files: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Deploy preview for PR #${{ github.event.number }}'
    
    - name: Comment preview link on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const prNumber = context.issue.number;
          const repo = context.repo;
          const previewUrl = `https://${repo.owner}.github.io/${repo.repo}/pr-preview/${prNumber}/`;
          
          github.rest.issues.createComment({
            issue_number: prNumber,
            owner: repo.owner,
            repo: repo.repo,
            body: `🎨 **Preview UI siap untuk direview!**\n\n🔗 Link: ${previewUrl}\n\n⚠️ *Catatan: Ini adalah preview tampilan. Jika ada error pada kode Dart, tampilan akan tetap ditampilkan sesuai kondisi yang bisa dirender.*`
          });
