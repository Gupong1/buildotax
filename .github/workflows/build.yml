name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Enable Flutter desktop (optional)
        run: flutter config --no-enable-web

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            build/
            .dart_tool/
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Flutter dependencies
        run: flutter pub get

      # --- FIX untuk dynamic_color ---
      - name: Fix Kotlin version for dynamic_color plugin
        run: |
          # Set Kotlin version di gradle.properties (jika belum ada)
          if ! grep -q "kotlin.version" android/gradle.properties 2>/dev/null; then
            echo "kotlin.version=1.9.0" >> android/gradle.properties
          fi

          # Pastikan build.gradle memiliki ext.kotlin_version dan classpath yang benar
          # Jika file belum memiliki ext.kotlin_version, tambahkan di awal
          if ! grep -q "ext.kotlin_version" android/build.gradle; then
            sed -i '1i ext.kotlin_version = "1.9.0"' android/build.gradle
          else
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.0"/' android/build.gradle
          fi

          # Pastikan classpath kotlin-gradle-plugin menggunakan variabel ext.kotlin_version
          if grep -q "classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin" android/build.gradle; then
            sed -i 's/classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:.*"/classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"/' android/build.gradle
          else
            # Jika tidak ada, tambahkan di bawah dependencies
            sed -i '/dependencies {/a \        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"' android/build.gradle
          fi
        continue-on-error: false

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
